### Continuous integration.
#
# There was none, which is why the findings that prompted it existed:
# ruff had been configured in pyproject.toml since the project started
# and nothing ever ran it (90 findings, two of them real bugs), and
# tools/ was excluded from every test path as "research, not the trading
# path" -- which quietly became "never even compiled", so a file with a
# syntax error sat committed and green.
#
# Nothing here touches the network, a broker, or data/. The suite runs
# against fakes by design and data/ is gitignored, so the probes in
# tools/ are checked for importability rather than run.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to the same branch makes the running one irrelevant.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned to the version the 90 findings were actually cleared against
  # and the 194 files were formatted with. A floating linter turns an
  # upstream release into a red build on a commit that changed nothing,
  # and a GUESSED pin does the same thing immediately -- the first draft
  # of this file pinned 0.14.2, which is not what had been run.
  RUFF_VERSION: "0.16.5"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff==${RUFF_VERSION}"
      - name: Lint
        run: ruff check .
      - name: Format
        # Enforceable only because the one large reformat has now
        # happened, in its own commit. Before that this would have
        # failed on 174 of 194 files, and adding it anyway would have
        # meant a permanently red build nobody could act on.
        run: ruff format --check .

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is what pyproject declares as the floor; 3.14 is what the
        # code is actually written and run on. Testing only one would
        # leave the other a claim: the floor could rot silently, or a
        # 3.14-only construct could land and break every user on the
        # declared minimum. fail-fast is off so a failure on one version
        # still reports the other.
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        # requirements.txt already pins pytest, so it is NOT installed
        # separately -- doing that would let CI pass against a pytest the
        # project does not declare. requirements-fidelity.txt is
        # deliberately skipped: it pulls Playwright and a browser, and
        # every Fidelity test runs against fakes. If that stops being
        # true a test fails on the import and says so, which is the right
        # way to find out.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run the suite
        run: python -m pytest tests/ -q

  audit:
    # The gap that let a non-parsing file ship. Kept as its own job, with
    # no dependencies installed, so it stays fast and its failure is not
    # buried in the suite's output.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Every script must at least parse
        # A file argument rather than a heredoc: a heredoc inside a YAML
        # block scalar depends on two layers of indentation agreeing, and
        # gets silently mangled when either is edited.
        run: python tools/check_syntax.py
