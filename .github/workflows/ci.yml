### Continuous integration.
#
# There was none. `pyproject.toml` had configured ruff since the project
# started and nothing ran it, so 90 lint findings had accumulated --
# including a dict with duplicate keys in src/config.py and a test
# asserting a bare Exception, neither of which is a style question.
#
# Worse, tools/ was excluded from every test path as "research, not the
# trading path", which quietly became "never even compiled": a file with
# a syntax error sat committed and green because nothing ever read it.
#
# So this runs three things, in increasing cost, and stops at the first
# failure of each job:
#
#   lint   ruff check      -- seconds
#   tests  the full suite  -- about a minute, no network, no data
#   audit  a data-free import of every module, which is what the
#          tools/ tests already assert but worth having stand alone
#
# WHAT IS DELIBERATELY NOT HERE
#
# `ruff format --check` would fail on 174 of 194 files. The formatter has
# never been run against this codebase, so adopting it is a single large
# reformatting commit and a decision about house style -- not something
# to smuggle in behind a CI file. `ruff check` is the half that finds
# bugs; formatting is the half that finds preferences.
#
# Nothing here touches the network, a broker, or data/. The full suite
# runs against fakes by design, and data/ is gitignored, so the probes
# in tools/ are checked for importability rather than run.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to the same branch makes the running one irrelevant.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ruff
        # Pinned to the version the 90 findings were actually cleared
        # against. A guessed pin is how CI goes red on a commit that
        # changed nothing.
        run: pip install "ruff==0.16.5"
      - name: Lint
        run: ruff check .

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        # requirements-fidelity.txt is NOT installed: it pulls Playwright
        # and a browser, and every Fidelity test runs against fakes. If
        # that ever stops being true, a test will fail on the import and
        # say so, which is the right way to find out.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run the suite
        run: python -m pytest tests/ -q

  audit:
    # The gap that let a non-parsing file ship. Cheap enough to run
    # separately so its failure is not buried in the suite's output.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Every script must at least parse
        run: |
          python - <<'PY'
          import ast, pathlib, sys
          bad = []
          for path in sorted(pathlib.Path(".").rglob("*.py")):
              if any(part in {".venv", "venv", "build", "dist"} for part in path.parts):
                  continue
              try:
                  ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              except SyntaxError as exc:
                  bad.append(f"{path}:{exc.lineno}: {exc.msg}")
          print(f"checked {sum(1 for _ in pathlib.Path('.').rglob('*.py'))} files")
          if bad:
              print("\n".join(bad), file=sys.stderr)
              sys.exit(1)
          PY
