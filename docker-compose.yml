services:
  # docker compose run --rm test
  # docker compose run --rm test -k my_test -v
  test:
    build: .
    entrypoint: ["python", "cli.py", "test"]

  # docker compose run --rm backtest --config /app/config/config.yaml --data /app/data/TQQQ_historical.csv
  backtest:
    build: .
    entrypoint: ["python", "cli.py", "backtest"]
    volumes:
      - ./data:/app/data:ro
      - ./config:/app/config:ro
      - ./output:/app/output

  # docker compose run --rm live --config /app/config/config.yaml
  # Credentials come ONLY from the environment (env_file below), per
  # src/secrets.py's policy -- never baked into the image, never
  # committed. See that file's own .gitignore/.dockerignore entries.
  # `live` connects to Alpaca via src/alpaca_broker.py and runs the
  # startup sequence through reconciliation to READY. Paper vs real
  # capital is decided by live.paper_trading in the config file.
  live:
    build: .
    entrypoint: ["python", "cli.py", "live"]
    env_file:
      - .env  # must define APCA_API_KEY_ID / APCA_API_SECRET_KEY; not committed
    volumes:
      - ./config:/app/config:ro
      - state:/app/state

  # 24/7 staging: Alpaca PAPER account, isolated state volume.
  # Requires real Alpaca paper credentials in .env.staging; startup
  # stops at RECOVERY_REQUIRED without them rather than trading blind.
  live-staging:
    build: .
    entrypoint: ["python", "cli.py", "live", "--config", "/app/config/staging.yaml"]
    env_file:
      - .env.staging  # must define APCA_API_KEY_ID / APCA_API_SECRET_KEY (paper account); not committed
    volumes:
      - ./config:/app/config:ro
      - state_staging:/app/state
    restart: unless-stopped

  # 24/7 production: Alpaca LIVE account (real capital), isolated state
  # volume. Reaching real capital is additionally gated by
  # src/promotion.py's promotion evidence -- Mode.LIVE will not
  # construct without a passing paper-trading record.
  live-production:
    build: .
    entrypoint: ["python", "cli.py", "live", "--config", "/app/config/production.yaml"]
    env_file:
      - .env.production  # must define APCA_API_KEY_ID / APCA_API_SECRET_KEY (live account); not committed
    volumes:
      - ./config:/app/config:ro
      - state_production:/app/state
    restart: unless-stopped

volumes:
  # Named volume, not a bind mount: the persistent SQLite ledger
  # (Task 7.3) and audit log (Task 7.14) that must survive a container
  # restart, per Task 7.12's whole design.
  state:
  # Isolated per-environment state so paper and real-money ledgers/audit
  # logs can never mix.
  state_staging:
  state_production:
