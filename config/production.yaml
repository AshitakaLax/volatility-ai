# Production: real capital. Requires promotion evidence (Task 7.7) in
# addition to live.enabled/paper_trading -- see engine/promotion.py.
# Credentials come from .env.production (APCA_API_KEY_ID / APCA_API_SECRET_KEY
# for the Alpaca LIVE account), never from this file.
strategy:
  strategy_id: fixed
  strategy_params:
    allocation_pct: 0.05
grid:
  steps: [0.005, 0.01, 0.015]
  profit_targets: [0.003, 0.005, 0.01]
backtest:
  symbol: TQQQ
  initial_cash: 100000.0
costs:
  model_type: zero
  commission_per_trade: 0.0
  slippage_bps: 0.0
risk:
  max_concurrent_lots: null
  max_total_exposure: null
  # The nightly risk report (docs/daily_risk_report_plan.md): ADVISORY --
  # each session's overlay is built from the evening's report, shown on the
  # Live page, archived and shadowed, and the session trades this file as
  # written. Real money stays advisory until a lever passes its paper gate
  # and the owner decides (validate() refuses enforce here).
  overlay:
    mode: advisory
search:
  strategy: grid
  rank_by: Capital Velocity Index
  direction: maximize
  seed: null
execution:
  on_flat_reentry: stale_reference
  intrabar_priority: sell_first
output:
  return_full_results: false
live:
  enabled: true
  paper_trading: false
  # The SINGLE parameter set real capital trades. These should be
  # promoted from a paper-trading run that met engine/promotion.py's
  # criteria, not copied optimistically from a backtest.
  step: 0.01
  profit_target: 0.005
  feed: iex
  poll_interval_seconds: 60.0
  max_sells_per_tick: 25
  # What the Live page may change here (LiveControlConfig). REAL MONEY: an
  # algorithm changes only to a committed profile with paper promotion
  # evidence, every command but a pause needs the deployment's id typed
  # back, and the ledger is never reset from the page.
  control:
    resume_buys: true
    enable_disable: true
    algorithm_changes: true
    # The nightly risk report, advisory (risk.overlay above); its id typed back.
    risk_reports: true
