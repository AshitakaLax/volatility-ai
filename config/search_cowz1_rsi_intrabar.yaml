# cowz1-rsi-intrabar -- identical to search_cowz1_rsi.yaml, except
# execution.fill_model: intrabar instead of the default "close". See
# search_cowz1_fixed_intrabar.yaml's header for why.
strategy:
  strategy_id: rsi
  strategy_params:
    max_trade_pct: [0.02, 0.05, 0.08, 0.12, 0.15]
    period: [5, 7, 10, 14, 21, 28]
    oversold_threshold: [20.0, 25.0, 30.0, 35.0, 40.0]
    baseline_multiplier: [0.0, 0.1, 0.2, 0.3, 0.4]
    aggression_factor: [0.5, 0.7, 0.8, 0.9, 1.0]
    exponent: [0.5, 0.75, 1.0, 1.5, 2.0]
grid:
  steps: [0.001, 0.0015, 0.002, 0.003, 0.004, 0.005, 0.0075, 0.01, 0.015, 0.02]
  profit_targets: [0.002, 0.003, 0.004, 0.005, 0.0075, 0.01, 0.015, 0.02, 0.03]
backtest:
  symbol: COWZ
  initial_cash: 100000.0
costs:
  model_type: slippage_commission
  commission_per_trade: 0.0
  slippage_bps: 5.0
risk:
  max_concurrent_lots: null
  max_total_exposure: null
search:
  strategy: bayesian
  rank_by: Total Return %
  direction: maximize
  seed: 42
execution:
  on_flat_reentry: stale_reference
  intrabar_priority: sell_first
  fill_model: intrabar
output:
  return_full_results: false
