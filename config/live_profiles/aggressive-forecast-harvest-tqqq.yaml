# Aggressive Forecast Harvest on TQQQ: config/forecast_harvest_aggressive_tqqq.yaml's
# algorithm, for paper-ultimate to switch to from the Live page. It is
# forecast-harvest-tqqq leaning on the nightly report (research/tests/
# test_forecast_harvest.py holds it to that profile plus five changes).
#
# It reads each session's report from the forecast database, which
# paper-ultimate mounts read-only at /app/warehouse/forecasts (docker-compose.yml).
# Check every evening's report on the Live page: that is what stores it. A
# session with no report uses TQQQ's own volatility instead.
#
# Not promoted: real money needs evidence.promotion naming a passing paper trial.
id: aggressive-forecast-harvest-tqqq
label: Aggressive Forecast Harvest, TQQQ (leans on the nightly report; day parts ~25% of profit)
symbols:
- TQQQ
strategy_id: forecast_harvest
strategy_params:
  bars_per_day: 387
  per_lot_pct: 0.008
  lookback_days: 0.02
  event_day_boost_multiplier: 2.5
  earnings_day_boost_multiplier: 1.5
  vol_scale_exponent: -1.5
  vol_fast_days: 0.25
  vol_slow_days: 10.0
  vol_scale_min: 0.25
  vol_scale_max: 3.0
  vol_measure: stdev
  volume_scale_exponent: -1.0
  natr_period: 14
  natr_lookback: 100
  regime_min_hold: 5
  bear_dd: 0.5
  bear_window: 250
  turbulent_mode: reversal
  reversal_threshold: -0.08
  reversal_target: 0.08
  reversal_lot_pct: 0.1
  reversal_max_lots: 2
  liquidate_minute: 60
  compound_lots: false
  daily_goal: 0.001
  goal_pause_buys: false
  goal_lock: false
  harvest_min_gain: 0.002
  whole_shares: true
  day_fraction: 0.75
  day_quantile: p75
  day_k: 2.5
  day_target_min: 0.003
  day_target_max: 0.08
  day_close_minute: 375
  swing_target: 0.2
  forecast_tilt: 0.5
  forecast_from_db: true
step: 0.002
profit_target: 0.2
evidence:
  note: >-
    config/forecast_harvest_aggressive_tqqq.yaml, chosen by tools/probe_forecast_harvest.py
    --stage aggressive (docs/research/forecast-harvest.md, "The aggressive profile").
    forecast-harvest-tqqq with the day level at 2.5x the report's p75, day parts
    allowed +0.3% to +8%, lots tilted by the report's median, and the report read
    from the forecast database. Against synthetic reports a wrong one costs about
    0.003% a session and a right one (rho 0.5) adds about 0.006%: it is a bet that
    the LLM report is right more often than not. Needs execution.allow_signal_exit,
    a regular-hours deployment, and the forecast database mounted.
  backtest:
    source: tools/probe_forecast_harvest.py --stage aggressive (agg k 2.5 max 0.08 min 0.003 close 375)
    window: 2016-01-04 to 2026-11-20, scored from 2017-01-03
    fills: intrabar causal, dynamic slippage, no cash yield
    reports: causal proxy (research/risk_overlay/proxy.py)
    per_session_pct: 0.145
    cagr_pct: 44.2
    max_drawdown_pct: 25.4
    invested_sessions_banking_a_profit_pct: 52
    day_parts_share_of_target_profit_pct: 25
    shares: whole
    initial_cash: 250000.0
