# DAILY ULTIMATE, the configuration the daily-ultimate sweep chose, on TQQQ
# (docs/research/daily-ultimate.md -- read its caveats before using this for
# anything but a backtest).
#
# A pinned single-point config, not a search space and not a deployment:
# there is no `live:` section.
#
# The goal: +0.1% of equity a session (28.6% a year over 252 sessions).
# The choice: the highest daily return within a 30% drawdown budget, a rule
# that held its rank out of sample (chosen on 2017-2021 alone, it ranked 2nd
# of 300 on 2022 onward). It is Ultimate's shape with bigger lots and a
# longer target -- the sweep found every daily switch (compounded lots, the
# goal's pause or lock, the closing harvest) costs return per session:
#
#   CALM       NATR(14) below its 100-session median at the previous close,
#              held at least 5 sessions, within 50% of the 250-session high:
#              the champion grid, a lot of 0.8% of STARTING equity at each
#              0.2% pullback, each sold at +12%.
#   TURBULENT  no grid. One event lot (20% of starting equity, +8% target,
#              at most 4 open) in the last 10 minutes of a session down 8%
#              or more.
#   THE FLIP   calm lots are sold an hour into the first turbulent session --
#              the one sale that may realise a loss (allow_signal_exit).
#   DAILY      daily_goal is tracked (the Live page reports goal sessions)
#              but pauses and sells nothing.
#
# tools/probe_daily_ultimate.py (intrabar causal fills, dynamic slippage, no
# cash yield, 2016-01-04 to 2026-11-03, scored from 2017-01-03):
#
#                         per session   CAGR    max DD   Sharpe   2022
#   this configuration       0.160%     49.6%   29.9%    1.67    -12.3%
#     2017-2021              0.220%     73.8%   20.5%
#     2022 onward            0.099%     28.2%   19.3%
#   TQQQ buy-and-hold        0.128%     37.8%   81.7%    0.82    -79.1%
#     2022 onward            0.033%      8.5%   81.0%
#
# Robust to slippage x10 (0.158%), lots x0.5-x2 and target x0.75-x2 (0.153-
# 0.165%). Sensitive to bear_window (125: 53.9% DD) and the regime's period
# (NATR(10) with -9%/+6% reversals: 42.5% DD). Not intraday: lots are held a
# median 10 sessions and 14% of sessions sell anything. Adding the goal lock
# (sell lots in profit once the session is up 0.1%) makes it a daily trader
# -- sales on 39% of sessions, 90% of lots closed within 5 -- at 0.113% a
# session (21.7% DD), but only 0.047% from 2022.
#
# Pinned to research/strategies/param_schema.py's
# STRATEGY_DEFAULTS["daily_ultimate"] by research/tests/test_daily_ultimate.py.
strategy:
  strategy_id: daily_ultimate
  strategy_params:
    bars_per_day: 387
    per_lot_pct: 0.008
    lookback_days: 0.02
    event_day_boost_multiplier: 2.5
    earnings_day_boost_multiplier: 1.5
    vol_scale_exponent: -1.5
    vol_fast_days: 0.25
    vol_slow_days: 10.0
    vol_scale_min: 0.25
    vol_scale_max: 3.0
    vol_measure: stdev
    volume_scale_exponent: -1.0
    natr_period: 14
    natr_lookback: 100
    regime_min_hold: 5
    bear_dd: 0.5
    bear_window: 250
    turbulent_mode: reversal
    reversal_threshold: -0.08
    reversal_target: 0.08
    reversal_lot_pct: 0.2
    reversal_max_lots: 4
    liquidate_minute: 60
    compound_lots: false
    daily_goal: 0.001
    goal_pause_buys: false
    goal_lock: false
    harvest_min_gain: 0.002
grid:
  steps: [0.002]
  profit_targets: [0.12]
backtest: {symbol: TQQQ, initial_cash: 100000.0}
costs: {model_type: dynamic_slippage, commission_per_trade: 0.0, base_bps: 0.5, vol_multiplier: 0.3}
risk: {}
search: {strategy: grid, rank_by: Total Return %, direction: maximize, seed: 42}
execution:
  on_flat_reentry: stale_reference
  intrabar_priority: sell_first
  fill_model: intrabar
  intrabar_fill: causal
  enforce_no_loss: true
  allow_signal_exit: true
  cash_yield_pct: 0.0
output: {return_full_results: false}
