# Comparative sweep: BAYESIAN_DUAL_SCALE strategy
# Learns success probability from past trials over two timescales
# Sweep targets, horizons, and confidence bounds
strategy:
  strategy_id: bayesian_dual_scale
  strategy_params:
    max_trade_pct: 0.08
    target_return: [0.002, 0.005, 0.01]
    horizon_days: [1, 3, 5]
    bars_per_day: 387
    fast_half_life_days: 5
    slow_half_life_days: 30
    confidence_k: [1.0, 1.5, 2.0]
    reference_probability: 0.5
    prior_alpha: 1
    prior_beta: 1
grid:
  steps: [0.005, 0.01, 0.015]
  profit_targets: [0.003, 0.005, 0.008]
backtest:
  symbol: TQQQ
  initial_cash: 100000.0
costs:
  model_type: dynamic_slippage
  commission_per_trade: 0.0
  base_bps: 0.5
  vol_multiplier: 0.3
risk:
  max_concurrent_lots: null
  max_total_exposure: null
search:
  strategy: bayesian
  rank_by: CAGR %
  direction: maximize
  seed: 42
execution:
  on_flat_reentry: stale_reference
  intrabar_priority: sell_first
  fill_model: close
  enforce_no_loss: true
output:
  return_full_results: false
