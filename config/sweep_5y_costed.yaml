# Same question as sweep_5y_boundary.yaml, but with a realistic cost
# model instead of a wider grid. Both prior sweeps used costs.model_type:
# zero and showed returns increasing monotonically toward the edge of
# every grid tried -- smaller steps, larger targets, no plateau. That is
# consistent with zero transaction costs: nothing penalizes trading
# more often, so the "optimum" just drifts toward whatever holds the
# position longest during a bull run, which approaches buy-and-hold.
#
# slippage_bps: 5 (0.05%) is a conservative estimate for a liquid ETF on
# the IEX feed -- real fills are typically better, but understating cost
# here would understate how much it should matter. commission_per_trade
# stays 0 (Alpaca charges no commission on equities).
strategy:
  strategy_id: fixed
  strategy_params:
    allocation_pct: 0.05
grid:
  steps: [0.001, 0.002, 0.003, 0.005, 0.01, 0.015]
  profit_targets: [0.002, 0.003, 0.005, 0.0075, 0.01, 0.015, 0.02]
backtest:
  symbol: TQQQ
  initial_cash: 100000.0
costs:
  model_type: slippage_commission
  commission_per_trade: 0.0
  slippage_bps: 5.0
risk:
  max_concurrent_lots: null
  max_total_exposure: null
search:
  strategy: grid
  rank_by: Total Return %
  direction: maximize
  seed: null
execution:
  on_flat_reentry: stale_reference
  intrabar_priority: sell_first
output:
  return_full_results: false
