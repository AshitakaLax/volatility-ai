# Staging: routes to a PAPER-mode OMS against Alpaca's paper endpoint.
# Credentials come from .env.staging (APCA_API_KEY_ID / APCA_API_SECRET_KEY
# for the Alpaca PAPER account), never from this file.
strategy:
  strategy_id: fixed
  strategy_params:
    allocation_pct: 0.05
grid:
  steps: [0.005, 0.01, 0.015]
  profit_targets: [0.003, 0.005, 0.01]
backtest:
  symbol: TQQQ
  initial_cash: 100000.0
costs:
  model_type: zero
  commission_per_trade: 0.0
  slippage_bps: 0.0
risk:
  max_concurrent_lots: null
  max_total_exposure: null
search:
  strategy: grid
  rank_by: Capital Velocity Index
  direction: maximize
  seed: null
execution:
  on_flat_reentry: stale_reference
  intrabar_priority: sell_first
output:
  return_full_results: false
live:
  enabled: true
  paper_trading: true
  # The SINGLE parameter set the loop trades. Deliberately separate from
  # grid.steps/grid.profit_targets above, which are sweep LISTS -- pick
  # these from a backtest result rather than letting sweep ordering
  # decide what real capital runs.
  step: 0.01
  profit_target: 0.005
  # iex is free on every account; sip is the full consolidated tape and
  # needs a paid data subscription. If the backtest that chose the
  # parameters above used sip data, running live on iex is a real
  # backtest/live mismatch.
  feed: iex
  poll_interval_seconds: 60.0
  max_sells_per_tick: 25
