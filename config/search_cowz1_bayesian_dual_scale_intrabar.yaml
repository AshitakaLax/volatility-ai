# cowz1-bayesian_dual_scale-intrabar -- identical to
# search_cowz1_bayesian_dual_scale.yaml, except execution.fill_model:
# intrabar instead of the default "close". See
# search_cowz1_fixed_intrabar.yaml's header for why -- the close-model
# sweep's top results were low-activity (7-22 closed trades over the full
# ~10-year window), and intrabar fills wherever a bar merely TOUCHES a
# level rather than requiring the close to reach it, which is the most
# direct lever available to test whether that low activity was a
# fill-model artifact rather than a property of the strategy itself.
strategy:
  strategy_id: bayesian_dual_scale
  strategy_params:
    bars_per_day: 210
    max_trade_pct: [0.02, 0.05, 0.08, 0.12]
    target_return: [0.002, 0.003, 0.005, 0.0075, 0.01, 0.015]
    horizon_days: [0.25, 0.5, 1.0, 2.0, 4.0]
    fast_half_life_days: [1.0, 2.0, 5.0, 10.0]
    slow_half_life_days: [20.0, 40.0, 80.0, 150.0]
    confidence_k: [0.5, 1.0, 1.5, 2.0, 2.5]
    reference_probability: [0.5, 0.6, 0.7, 0.8, 0.9, 0.95]
grid:
  steps: [0.001, 0.0015, 0.002, 0.003, 0.005, 0.0075, 0.01, 0.015]
  profit_targets: [0.002, 0.003, 0.005, 0.0075, 0.01, 0.015, 0.02, 0.03]
backtest:
  symbol: COWZ
  initial_cash: 100000.0
costs:
  model_type: slippage_commission
  commission_per_trade: 0.0
  slippage_bps: 5.0
risk:
  max_concurrent_lots: null
  max_total_exposure: null
search:
  strategy: bayesian
  rank_by: Total Return %
  direction: maximize
  seed: 42
execution:
  on_flat_reentry: stale_reference
  intrabar_priority: sell_first
  fill_model: intrabar
output:
  return_full_results: false
