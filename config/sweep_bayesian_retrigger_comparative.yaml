# BayesianDualScaleSizing with the new opt-in local-pullback retrigger
# (lookback_days), for a fair rerun against hf_local_reference's
# 39.36% CAGR / 72.76% DD result from the 5-strategy comparative sweep.
#
# Without this, BayesianDualScaleSizing inherited the DEFAULT
# _check_grid_trigger and traded exactly 54 times over the 10.63-year
# TQQQ SIP dataset -- see src/bayesian_sizing_calculators.py's module
# docstring, "THE OPTIONAL RETRIGGER" section, for the measurement.
# lookback_days here mirrors hf_local_reference's own intraday-scale
# windows (config/sweep_hf_comparative.yaml used 0.02).
#
# max_trade_pct is swept LOWER than sweep_bayesian_dual_scale_
# comparative.yaml's [0.05, 0.08, 0.10] -- unlike hf_local_reference's
# fixed dollar-per-lot sizing, this strategy still sizes as
# equity * max_trade_pct * posterior_multiplier, so retriggering far
# more often can exhaust cash after a handful of buys during one
# decline if max_trade_pct is left at its old (54-trades-only) scale.
strategy:
  strategy_id: bayesian_dual_scale
  strategy_params:
    max_trade_pct: [0.01, 0.02, 0.05]
    target_return: [0.002, 0.005, 0.01]
    horizon_days: [1, 3, 5]
    bars_per_day: 387
    fast_half_life_days: 5
    slow_half_life_days: 30
    confidence_k: [1.0, 1.5, 2.0]
    reference_probability: 0.5
    prior_alpha: 1
    prior_beta: 1
    lookback_days: [0.01, 0.02, 0.05]
grid:
  steps: [0.005, 0.01, 0.015]
  profit_targets: [0.003, 0.005, 0.008]
backtest:
  symbol: TQQQ
  initial_cash: 100000.0
costs:
  model_type: dynamic_slippage
  commission_per_trade: 0.0
  base_bps: 0.5
  vol_multiplier: 0.3
risk:
  max_concurrent_lots: null
  max_total_exposure: null
search:
  strategy: bayesian
  rank_by: CAGR %
  direction: maximize
  seed: 42
execution:
  on_flat_reentry: stale_reference
  intrabar_priority: sell_first
  fill_model: close
  enforce_no_loss: true
output:
  return_full_results: false
