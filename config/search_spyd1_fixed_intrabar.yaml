# spyd1-fixed-intrabar -- TPE search over FixedPortfolioPercentage on
# SPYD, intrabar fills. One of a three-strategy "spyd1" family (fixed,
# bayesian_dual_scale, hf_local_reference) run together to find the best
# trading parameters for SPYD, mirroring the cowz1 sweep family's
# structure and scope.
#
# bars_per_day: measured 749,308 bars / 2,684 sessions = 279.2 on this
# project's own SPYD warehouse data -- between COWZ's 209.9 (lower
# liquidity) and RSP's 390.0 (full RTH liquidity), so grid/target ranges
# here are pitched between the two rather than reusing either verbatim.
strategy:
  strategy_id: fixed
  strategy_params:
    allocation_pct: [0.02, 0.03, 0.05, 0.08, 0.12, 0.15, 0.20, 0.25]
grid:
  steps: [0.0002, 0.0005, 0.001, 0.002, 0.004, 0.0075, 0.012]
  profit_targets: [0.003, 0.006, 0.01, 0.02, 0.03, 0.05, 0.08]
backtest:
  symbol: SPYD
  initial_cash: 100000.0
costs:
  model_type: slippage_commission
  commission_per_trade: 0.0
  slippage_bps: 5.0
risk:
  max_concurrent_lots: null
  max_total_exposure: null
search:
  strategy: bayesian
  rank_by: Total Return %
  direction: maximize
  seed: 42
execution:
  on_flat_reentry: stale_reference
  intrabar_priority: sell_first
  fill_model: intrabar
output:
  return_full_results: false
