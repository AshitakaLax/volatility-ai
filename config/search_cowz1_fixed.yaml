# cowz1-fixed -- TPE search over FixedPortfolioPercentage on COWZ. See
# search_cowz1_hf_local_reference.yaml's header for the "cowz1"
# sweep-series context.
#
# FixedPortfolioPercentage takes exactly one strategy param
# (allocation_pct) and ignores ticks/drawdown entirely, so the whole
# search space here is that one axis crossed with grid_steps and
# profit_targets -- the SAME two axes every other cowz1-*.yaml config
# in this series searches, at the same bounds (derived from COWZ's own
# measured daily range: median 0.99%, mean 1.18%, 75th pct 1.47%,
# this sweep's --data), so this strategy's result is directly comparable
# against the others' on the axes they share.
strategy:
  strategy_id: fixed
  strategy_params:
    allocation_pct: [0.02, 0.03, 0.05, 0.08, 0.12, 0.15, 0.20, 0.25]
grid:
  steps: [0.001, 0.0015, 0.002, 0.003, 0.004, 0.005, 0.0075, 0.01, 0.015, 0.02]
  profit_targets: [0.002, 0.003, 0.004, 0.005, 0.0075, 0.01, 0.015, 0.02, 0.03]
backtest:
  symbol: COWZ
  initial_cash: 100000.0
costs:
  model_type: slippage_commission
  commission_per_trade: 0.0
  slippage_bps: 5.0
risk:
  max_concurrent_lots: null
  max_total_exposure: null
search:
  strategy: bayesian
  rank_by: Total Return %
  direction: maximize
  seed: 42
execution:
  on_flat_reentry: stale_reference
  intrabar_priority: sell_first
output:
  return_full_results: false
