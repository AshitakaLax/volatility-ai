# Comparative sweep: HF_LOCAL_REFERENCE strategy
# High-frequency intraday retriggers with vol/event awareness
# Smaller focused grid on the proven winner region (target 0.75)
# plus comparisons at 0.30 and 0.50
strategy:
  strategy_id: hf_local_reference
  strategy_params:
    bars_per_day: 387
    per_lot_pct: [0.0002, 0.0005, 0.001]
    lookback_days: 0.02
    event_day_boost_multiplier: 2.5
    earnings_day_boost_multiplier: 1.5
    vol_scale_exponent: -1.5
    vol_fast_days: 0.25
    vol_slow_days: 10.0
    vol_scale_min: 0.25
    vol_scale_max: 3.0
    vol_measure: stdev
    volume_scale_exponent: -1.0
grid:
  steps: [0.00075, 0.0015]
  profit_targets: [0.30, 0.50, 0.75]
backtest:
  symbol: TQQQ
  initial_cash: 100000.0
costs:
  model_type: dynamic_slippage
  commission_per_trade: 0.0
  base_bps: 0.5
  vol_multiplier: 0.3
risk:
  max_concurrent_lots: 6000
  max_total_exposure: null
search:
  strategy: grid
  rank_by: CAGR %
  direction: maximize
  seed: 42
execution:
  on_flat_reentry: stale_reference
  intrabar_priority: sell_first
  fill_model: intrabar
  enforce_no_loss: true
output:
  return_full_results: false
