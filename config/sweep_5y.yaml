# Parameter-search config, NOT a deployment config (no `live:` section).
# Exists to answer one question: what step/profit_target actually work
# on 1-minute TQQQ bars, given the 2-year sweep (config/staging.yaml's
# grid) produced only 41 trades over 500 sessions -- a strong sign that
# grid.steps=[0.005,0.01,0.015] was sized for daily bars, not minute
# bars. This widens the grid toward finer steps to find out.
#
# rank_by is "Total Return %", not the default "Capital Velocity Index":
# CVI is closed_lots/total_lots and saturates at 1.0 whenever every lot
# closes by the end of the run, which happened for all 9 combinations in
# the prior sweep. Ranking by it here would again sort on a constant.
strategy:
  strategy_id: fixed
  strategy_params:
    allocation_pct: 0.05
grid:
  steps: [0.002, 0.003, 0.005, 0.0075, 0.01, 0.015]
  profit_targets: [0.001, 0.002, 0.003, 0.005, 0.0075, 0.01]
backtest:
  symbol: TQQQ
  initial_cash: 100000.0
costs:
  model_type: zero
  commission_per_trade: 0.0
  slippage_bps: 0.0
risk:
  max_concurrent_lots: null
  max_total_exposure: null
search:
  strategy: grid
  rank_by: Total Return %
  direction: maximize
  seed: null
execution:
  on_flat_reentry: stale_reference
  intrabar_priority: sell_first
output:
  # true here would surface a pre-existing bug in cli.py's cmd_backtest:
  # run_sweep(return_full_results=True) returns a (summary_df, full)
  # tuple, and cmd_backtest calls results.head(10) unconditionally --
  # AttributeError. cli.py backtest cannot currently drive this flag
  # from any config, not just this one. Left false to route around it;
  # flagged as a real, separate gap.
  return_full_results: false
