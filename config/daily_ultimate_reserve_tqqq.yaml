# DAILY ULTIMATE RESERVE, on TQQQ: the configuration the reserve sweep chose
# (docs/research/daily-ultimate-reserve.md -- read its caveats before using
# this for anything but a backtest).
#
# A pinned single-point config, not a search space and not a deployment:
# there is no `live:` section.
#
# The goal: +0.1% of equity a session at the least drawdown, with as much of
# the account in cash as possible, still standing in a bear worse than 2022's.
# The choice (tools/probe_daily_reserve.py): at the goal over history, the
# shallowest WORST drawdown over history and five stress paths, ties to the
# lower average exposure; then the lot stepped down to spend the return above
# the goal. It is daily_ultimate (config/daily_ultimate_tqqq.yaml) with:
#
#   LOTS       0.25% of the SESSION'S opening equity (compound_lots), at each
#              0.4% pullback, each sold at +12%.
#   TURBULENT  cash: no reversal lots. Calm lots are still sold an hour into
#              the first turbulent session (allow_signal_exit).
#   PAUSE      a calm session buys nothing more once it is up 0.1%.
#   THROTTLE   the exposure ceiling ramps from 100% of equity at a 5%
#              drawdown to 10% at a 20% drawdown.
#
# tools/probe_daily_reserve.py (intrabar causal fills, dynamic slippage, no
# cash yield, 2016-01-04 to 2026-11-04, scored from 2017-01-03):
#
#                         per session   CAGR   max DD   avg in TQQQ
#   this configuration       0.101%     28.8%   18.5%      25.1%
#     2017-2021              0.124%             18.5%
#     2022 onward            0.077%             16.4%
#   worst stress path                           18.5%
#   opened at the 2021 top                      16.4%
#   daily_ultimate_tqqq      0.161%     49.7%   29.9%      40.2%
#     worst stress path                         57.6%  (opened at the 2021 top)
#   TQQQ buy-and-hold        0.129%     38.2%   81.7%     100%
#
# IT DOES NOT MAKE 0.1% A SESSION FROM 2022 ON (0.077%). No configuration in
# the sweep both does that and keeps its drawdown under 34%; the report's `both`
# section has the ones that do. It holds 100% of the account in TQQQ on
# its fullest days (95% at the 95th percentile) and closes 52% of sessions
# all in cash. An exposure cap of 50% tops out at 0.085% a session.
#
# Pinned to tools/probe_daily_reserve.py's CHOSEN by
# tools/tests/test_probe_daily_reserve.py.
strategy:
  strategy_id: daily_ultimate
  strategy_params:
    bars_per_day: 387
    lookback_days: 0.02
    event_day_boost_multiplier: 2.5
    earnings_day_boost_multiplier: 1.5
    vol_scale_exponent: -1.5
    vol_fast_days: 0.25
    vol_slow_days: 10.0
    vol_scale_min: 0.25
    vol_scale_max: 3.0
    vol_measure: stdev
    volume_scale_exponent: -1.0
    natr_period: 14
    natr_lookback: 100
    regime_min_hold: 5
    bear_dd: 0.5
    bear_window: 250
    turbulent_mode: cash
    reversal_lot_pct: 0.2
    reversal_max_lots: 4
    liquidate_minute: 60
    per_lot_pct: 0.0025
    reversal_threshold: -0.08
    reversal_target: 0.08
    compound_lots: true
    daily_goal: 0.001
    goal_pause_buys: true
    harvest_min_gain: 0.002
grid:
  steps: [0.004]
  profit_targets: [0.12]
backtest: {symbol: TQQQ, initial_cash: 100000.0}
costs: {model_type: dynamic_slippage, commission_per_trade: 0.0, base_bps: 0.5, vol_multiplier: 0.3}
risk: {dd_exposure_start: 0.05, dd_exposure_full: 0.2, dd_exposure_floor_pct: 0.1}
search: {strategy: grid, rank_by: Total Return %}
execution:
  on_flat_reentry: stale_reference
  intrabar_priority: sell_first
  fill_model: intrabar
  intrabar_fill: causal
  enforce_no_loss: true
  allow_signal_exit: true
  cash_yield_pct: 0.0
output: {return_full_results: false}
