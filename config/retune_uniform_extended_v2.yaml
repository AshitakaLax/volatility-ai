# Re-tune v2: fixes a real config bug found in retune_uniform_extended.yaml
# (commit 23c80a6). trail_min_profit_target was left at 0.001 -- the old
# HF default, appropriate for that strategy's thin 0.003-0.01 targets --
# against profit_targets of 0.30-1.00 here. TrailingTargetPolicy.propose
# correctly takes max(trailed_price, floor_price), so with a floor this
# far below every configured target, the floor won every single time,
# on the FIRST tick after entry (peak barely above buy_price), before
# any real trailing could happen. Verified directly:
#   propose() at price=100.0, buy_price=100.0, profit_target=0.30 ->
#   0.30 collapses to 0.001 immediately. Every profit_target produced
#   BYTE-IDENTICAL results (651,308 trades, 5.24% CAGR) once trail_pct
#   was set, regardless of its own value -- proof the floor, not the
#   target, was driving every result.
#
# trail_min_profit_target=0.10 here instead: a lot needs to have
# actually gained something (10%+) before trailing can offer an exit
# below its original target, rather than collapsing to a razor's edge
# on bar one. weighted_event_boost_multiplier is dropped from this
# sweep -- v1 showed it made negligible difference in the untrailed
# rows (38.605871 vs 38.605545 CAGR at target=1.00), so this budget
# goes entirely to the trailing question instead.
#
# v1's UNTRAILED baseline stands as the reference to beat:
#   target=1.00: 38.61% CAGR, 82.4% DD
#   target=0.75: 38.52% CAGR, 76.7% DD
#   target=0.50: 38.22% CAGR, 73.5% DD
#   target=0.30: 36.98% CAGR, 73.5% DD
#
# 4 targets x 4 trail_pct (incl. null, the untrailed re-confirmation) = 16.
strategy:
  strategy_id: hf_local_reference
  strategy_params:
    bars_per_day: 960
    per_lot_pct: 0.001
    lookback_days: 0.02
    event_day_boost_multiplier: 2.5
    earnings_day_boost_multiplier: 1.5
    vol_scale_exponent: -1.5
    vol_fast_days: 0.25
    vol_slow_days: 10.0
    vol_scale_min: 0.25
    vol_scale_max: 3.0
    vol_measure: stdev
    volume_scale_exponent: -1.0
    trail_pct: [null, 0.05, 0.10, 0.20]
    trail_min_profit_target: 0.10
    weighted_event_boost_multiplier: 2.5
grid:
  steps: [0.00075]
  profit_targets: [0.30, 0.50, 0.75, 1.00]
backtest: {symbol: TQQQ, initial_cash: 100000.0}
costs: {model_type: dynamic_slippage, commission_per_trade: 0.0, base_bps: 0.5, vol_multiplier: 0.3}
risk: {max_concurrent_lots: 6000, max_total_exposure: null}
search: {strategy: grid, rank_by: CAGR %, direction: maximize, seed: 42}
execution: {on_flat_reentry: stale_reference, intrabar_priority: sell_first, fill_model: intrabar, enforce_no_loss: true}
output: {return_full_results: false}
