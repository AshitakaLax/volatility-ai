# Re-tune on the uniform extended-hours dataset (04:00-20:00 ET, every
# session resampled to exactly 960 bars -- see
# src/historical_data.resample_to_uniform_minutes and commit 7bd7367).
# bars_per_day=960 is EXACT here, not measured/approximate, which is
# the whole point of the resample: drift was 2.08x on the raw extended
# pull (459 bars/session in 2016 vs 954 in 2026).
#
# Every previous sweep ran on the 387-bar RTH-only dataset. This is the
# first sweep since:
#   - trailing exit targets (commit c933b90) -- the prior best-known
#     config (target=0.75) left 6,000 lots open at the end of a run;
#     a 2022-2023 zero-cost check found it closed ZERO of 3,177 lots.
#     trail_pct=null is included as the untrailed baseline for direct
#     comparison, not assumed inferior.
#   - weighted, minute-precise event awareness (commit b8b398e) --
#     weighted_event_boost_multiplier=1.0 is the no-op baseline.
#   - the vol-window synthetic-bar guard (commit 7eb56c1), needed for
#     this dataset specifically (52.2% of 2016's bars are synthetic).
#
# step and per_lot_pct are FIXED at the best values three prior sweeps
# agreed on (step=0.00075) and the frontier sweep's cap-compliant
# winner (per_lot_pct=0.001), to keep this sweep's real questions --
# does trailing help, does the weighted event signal help, where does
# profit_target land now -- from being diluted across a 2.47x larger
# dataset (2,558,400 bars vs 1,035,332) than every prior sweep ran on.
#
# 4 targets x (4 trail_pct x 2 weighted_event_boost) = 32 combinations.
strategy:
  strategy_id: hf_local_reference
  strategy_params:
    bars_per_day: 960
    per_lot_pct: 0.001
    lookback_days: 0.02
    event_day_boost_multiplier: 2.5
    earnings_day_boost_multiplier: 1.5
    vol_scale_exponent: -1.5
    vol_fast_days: 0.25
    vol_slow_days: 10.0
    vol_scale_min: 0.25
    vol_scale_max: 3.0
    vol_measure: stdev
    volume_scale_exponent: -1.0
    trail_pct: [null, 0.05, 0.10, 0.20]
    trail_min_profit_target: 0.001
    weighted_event_boost_multiplier: [1.0, 2.5]
grid:
  steps: [0.00075]
  profit_targets: [0.30, 0.50, 0.75, 1.00]
backtest: {symbol: TQQQ, initial_cash: 100000.0}
costs: {model_type: dynamic_slippage, commission_per_trade: 0.0, base_bps: 0.5, vol_multiplier: 0.3}
risk: {max_concurrent_lots: 6000, max_total_exposure: null}
search: {strategy: grid, rank_by: CAGR %, direction: maximize, seed: 42}
execution: {on_flat_reentry: stale_reference, intrabar_priority: sell_first, fill_model: intrabar, enforce_no_loss: true}
output: {return_full_results: false}
