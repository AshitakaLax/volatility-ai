# cowz1-fixed-intrabar -- identical to search_cowz1_fixed.yaml, except
# execution.fill_model: intrabar instead of the default "close". "close"
# requires the bar's CLOSE to reach a triggering/filling level; "intrabar"
# fills a level merely TOUCHED during the bar (measured elsewhere in this
# project at roughly 1.85x more fills than close-only on this project's
# own minute data), which matters most for a low-volatility instrument
# like COWZ, where a bar can wick through a grid/target level and close
# back away from it. Run alongside the close-model sweep to see whether
# intrabar fills meaningfully change trade frequency/return here, not
# assumed.
strategy:
  strategy_id: fixed
  strategy_params:
    allocation_pct: [0.02, 0.03, 0.05, 0.08, 0.12, 0.15, 0.20, 0.25]
grid:
  steps: [0.001, 0.0015, 0.002, 0.003, 0.004, 0.005, 0.0075, 0.01, 0.015, 0.02]
  profit_targets: [0.002, 0.003, 0.004, 0.005, 0.0075, 0.01, 0.015, 0.02, 0.03]
backtest:
  symbol: COWZ
  initial_cash: 100000.0
costs:
  model_type: slippage_commission
  commission_per_trade: 0.0
  slippage_bps: 5.0
risk:
  max_concurrent_lots: null
  max_total_exposure: null
search:
  strategy: bayesian
  rank_by: Total Return %
  direction: maximize
  seed: 42
execution:
  on_flat_reentry: stale_reference
  intrabar_priority: sell_first
  fill_model: intrabar
output:
  return_full_results: false
