# sweep_rsp_hf_intrabar_broad -- Broad exhaustive grid sweep over
# HighFrequencyLocalReferenceSizing on RSP using the INTRABAR fill model.
#
# RSP characteristics (measured on this dataset, 2016-01 to 2026-08):
#   bars_per_day: 390 (RTH-uniform grid, 1,044,810 bars / 2,679 sessions)
#   median daily range: 0.92%, mean 1.15%, p75 1.38%
#   median 1-min intrabar range: 2.2 bps
#   Total return: 251.0% (3.51x over decade)
#   Equal-weight S&P 500, NOT leveraged
#   RTH-uniform dataset (extended-hours bars are 60.9% fabricated)
#
# Design rationale (from probe_rsp_scaled.yaml and probe_rsp_tight.yaml):
# - per_lot_pct and steps scaled to RSP's own daily/intrabar range (NOT TQQQ's)
# - profit_targets in the 0.5%-4% range (tight, per probe_rsp_tight findings):
#   RSP's 14.2% annualized vol means 5-40% targets are multi-year holds
#   0.5%-4% targets actually harvest volatility on this instrument
# - bars_per_day = 390 (RTH-uniform, NOT 960 extended-hours)
# - vol_scale_exponent: -1.5 (size down into volatility, measured effective)
# - event_day_boost_multiplier: 2.5 (FOMC days show 33-37% higher realized vol)
#
# Grid size: 1 per_lot_pct x 1 lookback x 1 event_boost x 1 earn_boost x 3 steps x 4 targets
# = 12 combinations (exhaustive, fast). Can expand per_lot_pct/lookback if needed.
#
# fill_model: intrabar (resting limit orders fill on TOUCH, not close)
# enforce_no_loss: true (structural invariant)

strategy:
  strategy_id: hf_local_reference
  strategy_params:
    bars_per_day: 390
    per_lot_pct: [0.0005, 0.001, 0.0015, 0.002, 0.003, 0.005]
    lookback_days: [0.02, 0.05, 0.1, 0.2, 0.5]
    event_day_boost_multiplier: [1.0, 1.5, 2.0, 2.5]
    earnings_day_boost_multiplier: [1.0, 1.5, 2.0]
    vol_scale_exponent: -1.5
    vol_fast_days: 0.25
    vol_slow_days: 10.0
    vol_scale_min: 0.25
    vol_scale_max: 3.0
    vol_measure: stdev
    volume_scale_exponent: -1.0
    weighted_event_boost_multiplier: 2.5

grid:
  # Steps centered on RSP's ~2.2bps median intrabar range
  # From probe_rsp_tight: 0.0001-0.0004 range (vol-equivalent to TQQQ's 0.00075)
  steps: [0.0001, 0.00015, 0.0002, 0.0003, 0.0004, 0.0005, 0.00075, 0.001]
  # Tight targets per probe_rsp_tight: 0.5%-4% actually harvest vol on 14.2% annual vol
  profit_targets: [0.005, 0.01, 0.015, 0.02, 0.03, 0.04]

backtest:
  symbol: RSP
  initial_cash: 100000.0

costs:
  model_type: dynamic_slippage
  commission_per_trade: 0.0
  base_bps: 0.5
  vol_multiplier: 0.3

risk:
  max_concurrent_lots: 6000
  max_total_exposure: null

search:
  strategy: grid
  rank_by: CAGR %
  direction: maximize
  seed: 42

execution:
  on_flat_reentry: stale_reference
  intrabar_priority: sell_first
  fill_model: intrabar
  enforce_no_loss: true

output:
  return_full_results: false