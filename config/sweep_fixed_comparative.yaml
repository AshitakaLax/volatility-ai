# Comparative sweep: FIXED strategy
# Simple allocation-based sizing, using classic grid trigger
# Parameters are intentionally simple for fast baseline
strategy:
  strategy_id: fixed
  strategy_params:
    allocation_pct: [0.02, 0.05, 0.08, 0.10]
grid:
  steps: [0.005, 0.01, 0.015, 0.02]
  profit_targets: [0.002, 0.005, 0.01]
backtest:
  symbol: TQQQ
  initial_cash: 100000.0
costs:
  model_type: dynamic_slippage
  commission_per_trade: 0.0
  base_bps: 0.5
  vol_multiplier: 0.3
risk:
  max_concurrent_lots: null
  max_total_exposure: null
search:
  strategy: grid
  rank_by: CAGR %
  direction: maximize
  seed: 42
execution:
  on_flat_reentry: stale_reference
  intrabar_priority: sell_first
  fill_model: close
  enforce_no_loss: true
output:
  return_full_results: false
