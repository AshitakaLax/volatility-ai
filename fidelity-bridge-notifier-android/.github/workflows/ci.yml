# Runs when this folder is its own repository. (Inside volatility-ai, GitHub
# reads only the root's .github/, so nothing here runs there.)
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Protocol and connection tests (no Android SDK needed)
        run: ./gradlew -p core test
      - name: Build the debug APK
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: bridge-notifier-debug
          path: app/build/outputs/apk/debug/app-debug.apk
